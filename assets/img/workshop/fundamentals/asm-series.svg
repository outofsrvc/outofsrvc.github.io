<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10"/>
      <stop offset="100%" style="stop-color:#141821"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <!-- x86 Assembly -->
  <g transform="translate(40, 40)" font-family="IBM Plex Mono, monospace" font-size="11" fill="#dee4ed">
    <rect x="0" y="0" width="520" height="260" rx="4" fill="#0e1116" stroke="#1d222c" stroke-width="1"/>
    <!-- Registers -->
    <text x="16" y="28" fill="#22d3ee">; x86-64 Registers & Calling Convention</text>
    <text x="16" y="52" fill="#7dd3fc">; General Purpose Registers (64-bit)</text>
    <text x="16" y="72" fill="#e2e8f0">RAX</text> <text x="60" y="72" fill="#5f6978">; Return value / Syscall number</text>
    <text x="16" y="90" fill="#e2e8f0">RBX</text> <text x="60" y="90" fill="#5f6978">; Callee-saved</text>
    <text x="16" y="108" fill="#e2e8f0">RCX</text> <text x="60" y="108" fill="#5f6978">; 4th arg / Loop counter</text>
    <text x="16" y="126" fill="#e2e8f0">RDX</text> <text x="60" y="126" fill="#5f6978">; 3rd arg / Syscall arg</text>
    <text x="16" y="144" fill="#e2e8f0">RSI</text> <text x="60" y="144" fill="#5f6978">; 2nd arg / Source index</text>
    <text x="16" y="162" fill="#e2e8f0">RDI</text> <text x="60" y="162" fill="#5f6978">; 1st arg / Dest index</text>
    <text x="16" y="180" fill="#e2e8f0">RBP</text> <text x="60" y="180" fill="#5f6978">; Frame pointer</text>
    <text x="16" y="198" fill="#e2e8f0">RSP</text> <text x="60" y="198" fill="#5f6978">; Stack pointer</text>
    <text x="16" y="216" fill="#e2e8f0">R8-R15</text> <text x="75" y="216" fill="#5f6978">; Additional registers (x86-64)</text>
    
    <!-- Instructions -->
    <text x="280" y="52" fill="#7dd3fc">; Common Instructions</text>
    <text x="280" y="72" fill="#fbbf24">MOV</text> <text x="320" y="72" fill="#e2e8f0">RAX, RBX</text> <text x="410" y="72" fill="#5f6978">; Copy</text>
    <text x="280" y="90" fill="#fbbf24">LEA</text> <text x="320" y="90" fill="#e2e8f0">RAX, [RBX+RCX*8]</text> <text x="410" y="90" fill="#5f6978">; Address calc</text>
    <text x="280" y="108" fill="#7dd3fc">CMP</text> <text x="320" y="108" fill="#e2e8f0">RAX, 0</text> <text x="410" y="108" fill="#5f6978">; Compare</text>
    <text x="280" y="126" fill="#f87171">JNE</text> <text x="320" y="126" fill="#e2e8f0">loop_start</text> <text x="410" y="126" fill="#5f6978">; Conditional jump</text>
    <text x="280" y="144" fill="#7dd3fc">CALL</text> <text x="320" y="144" fill="#e2e8f0">malloc</text> <text x="410" y="144" fill="#5f6978">; Function call</text>
    <text x="280" y="162" fill="#f87171">RET</text> <text x="410" y="162" fill="#5f6978">; Return</text>
    <text x="280" y="180" fill="#7dd3fc">PUSH</text> <text x="320" y="180" fill="#e2e8f0">RBP</text> <text x="410" y="180" fill="#5f6978">; Stack ops</text>
    <text x="280" y="198" fill="#7dd3fc">POP</text> <text x="320" y="198" fill="#e2e8f0">RBP</text>
    <text x="280" y="216" fill="#a5b4fc">SYSCALL</text> <text x="410" y="216" fill="#5f6978">; Kernel entry</text>
  </g>
  <text x="300" y="320" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5f6978" text-anchor="middle">Figure (5): Excerpt from the x86 Assembly lessons</text>
</svg>
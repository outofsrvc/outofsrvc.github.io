<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10"/>
      <stop offset="100%" style="stop-color:#141821"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <!-- Network layers -->
  <g transform="translate(300, 170)" font-family="IBM Plex Mono, monospace" font-size="11" fill="#dee4ed">
    <!-- OSI Model layers -->
    <rect x="-200" y="-140" width="400" height="35" rx="4" fill="#0e1116" stroke="#a5b4fc" stroke-width="1"/>
    <text x="0" y="-116" fill="#a5b4fc" text-anchor="middle">7. APPLICATION  (HTTP, DNS, TLS)</text>
    
    <rect x="-200" y="-100" width="400" height="35" rx="4" fill="#0e1116" stroke="#a5b4fc" stroke-width="1"/>
    <text x="0" y="-76" fill="#a5b4fc" text-anchor="middle">6. PRESENTATION  (Encoding, Encryption)</text>
    
    <rect x="-200" y="-60" width="400" height="35" rx="4" fill="#0e1116" stroke="#a5b4fc" stroke-width="1"/>
    <text x="0" y="-36" fill="#a5b4fc" text-anchor="middle">5. SESSION  (Connection Management)</text>
    
    <rect x="-200" y="-20" width="400" height="35" rx="4" fill="#0e1116" stroke="#22d3ee" stroke-width="1"/>
    <text x="0" y="4" fill="#22d3ee" text-anchor="middle">4. TRANSPORT  (TCP / UDP)  ← Malware C2</text>
    
    <rect x="-200" y="20" width="400" height="35" rx="4" fill="#0e1116" stroke="#22d3ee" stroke-width="1"/>
    <text x="0" y="44" fill="#22d3ee" text-anchor="middle">3. NETWORK  (IP, Routing, ICMP)</text>
    
    <rect x="-200" y="60" width="400" height="35" rx="4" fill="#0e1116" stroke="#34d399" stroke-width="1"/>
    <text x="0" y="84" fill="#34d399" text-anchor="middle">2. DATA LINK  (Ethernet, MAC, ARP)</text>
    
    <rect x="-200" y="100" width="400" height="35" rx="4" fill="#0e1116" stroke="#34d399" stroke-width="1"/>
    <text x="0" y="124" fill="#34d399" text-anchor="middle">1. PHYSICAL  (Cables, WiFi, Signals)</text>
    
    <!-- TCP Packet detail -->
    <rect x="-200" y="150" width="400" height="60" rx="4" fill="#0e1116" stroke="#fbbf24" stroke-width="1"/>
    <text x="-190" y="170" fill="#fbbf24">TCP Header:</text>
    <text x="-190" y="190" fill="#97a1b0" font-size="9">Src Port | Dst Port | Seq Num | Ack Num | Flags(SYN/ACK/PSH/RST/FIN) | Window | Checksum | Urgent Ptr</text>
    <text x="190" y="170" fill="#f87171" text-anchor="end">Malware beacon → </text>
    <text x="190" y="190" fill="#f87171" text-anchor="end" font-size="9">Dst: 443/80/8080 | PSH+ACK | Encrypted payload</text>
  </g>
  <text x="300" y="320" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5f6978" text-anchor="middle">Figure (4): Excerpt from the networking lessons by brother Storm</text>
</svg>
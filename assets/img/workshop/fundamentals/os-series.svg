<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10"/>
      <stop offset="100%" style="stop-color:#141821"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <!-- OS Concepts - Process/Memory management -->
  <g transform="translate(300, 170)" font-family="IBM Plex Mono, monospace" font-size="11" fill="#dee4ed">
    <!-- User Space -->
    <rect x="-250" y="-120" width="220" height="240" rx="6" fill="#0e1116" stroke="#f87171" stroke-width="1"/>
    <text x="-140" y="-100" fill="#f87171" text-anchor="middle">USER SPACE</text>
    
    <rect x="-230" y="-80" width="180" height="50" rx="4" fill="#1d222c" stroke="#fbbf24"/>
    <text x="-140" y="-50" fill="#fbbf24" text-anchor="middle">Process A</text>
    <text x="-140" y="-36" fill="#97a1b0" text-anchor="middle" font-size="9">PID: 1247 | VAS</text>
    
    <rect x="-230" y="-10" width="180" height="50" rx="4" fill="#1d222c" stroke="#fbbf24"/>
    <text x="-140" y="20" fill="#fbbf24" text-anchor="middle">Process B</text>
    <text x="-140" y="34" fill="#97a1b0" text-anchor="middle" font-size="9">PID: 1248 | VAS</text>
    
    <rect x="-230" y="60" width="180" height="50" rx="4" fill="#1d222c" stroke="#fbbf24"/>
    <text x="-140" y="90" fill="#fbbf24" text-anchor="middle">Process C</text>
    <text x="-140" y="104" fill="#97a1b0" text-anchor="middle" font-size="9">PID: 1249 | VAS</text>
    
    <!-- Kernel Space -->
    <rect x="30" y="-120" width="220" height="240" rx="6" fill="#0e1116" stroke="#34d399" stroke-width="1"/>
    <text x="140" y="-100" fill="#34d399" text-anchor="middle">KERNEL SPACE</text>
    
    <rect x="50" y="-80" width="180" height="40" rx="4" fill="#1d222c" stroke="#22d3ee"/>
    <text x="140" y="-56" fill="#22d3ee" text-anchor="middle">Scheduler</text>
    <text x="140" y="-44" fill="#97a1b0" text-anchor="middle" font-size="9">CFS / RT</text>
    
    <rect x="50" y="-20" width="180" height="40" rx="4" fill="#1d222c" stroke="#22d3ee"/>
    <text x="140" y="4" fill="#22d3ee" text-anchor="middle">Memory Manager</text>
    <text x="140" y="16" fill="#97a1b0" text-anchor="middle" font-size="9">Paging / VMA</text>
    
    <rect x="50" y="40" width="180" height="40" rx="4" fill="#1d222c" stroke="#22d3ee"/>
    <text x="140" y="64" fill="#22d3ee" text-anchor="middle">Syscall Interface</text>
    <text x="140" y="76" fill="#97a1b0" text-anchor="middle" font-size="9">sys_enter / exit</text>
    
    <rect x="50" y="100" width="180" height="40" rx="4" fill="#1d222c" stroke="#22d3ee"/>
    <text x="140" y="124" fill="#22d3ee" text-anchor="middle">VFS / Drivers</text>
    <text x="140" y="136" fill="#97a1b0" text-anchor="middle" font-size="9">ext4 / block</text>
    
    <!-- Syscall arrows -->
    <line x1="-30" y1="-50" x2="30" y2="-50" stroke="#97a1b0" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#97a1b0" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#97a1b0"/>
      </marker>
    </defs>
  </g>
  <text x="300" y="320" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5f6978" text-anchor="middle">Figure (3): Excerpt from the operating systems lessons</text>
</svg>
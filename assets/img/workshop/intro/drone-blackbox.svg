      <stop offset="0%" style="stop-color:#0a0c10"/>
      <stop offset="100%" style="stop-color:#141821"/>
    </linearGradient>
    <linearGradient id="grid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d222c"/>
      <stop offset="50%" style="stop-color:#1d222c"/>
      <stop offset="50%" style="stop-color:transparent"/>

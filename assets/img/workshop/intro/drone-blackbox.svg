    <line x1="60" y1="0" x2="100" y2="0" stroke-dasharray="8,4"/>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke-dasharray="8,4"/>
    <polygon points="0,-80 -8,-60 8,-60" fill="#22d3ee"/>
  </g>
  <text x="400" y="380" font-family="IBM Plex Mono, monospace" font-size="14" fill="#5f6978" text-anchor="middle">Figure (1): Treating unknown technology as a black box</text>

    </g>
    <circle r="25" fill="#0a0c10" stroke="#34d399" stroke-width="2"/>
    <circle r="10" fill="#34d399"/>
    <!-- Trigger mechanism -->
    <rect x="90" y="-30" width="120" height="60" rx="5" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <line x1="105" y1="0" x2="195" y2="0" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,4"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10"/>
      <stop offset="100%" style="stop-color:#141821"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Software RE - control flow graph -->
  <g transform="translate(400, 225)" fill="none" stroke="#22d3ee" stroke-width="2">
    <!-- Nodes -->
    <circle cx="-180" cy="0" r="35" fill="none"/>
    <text x="-180" y="5" font-family="IBM Plex Mono, monospace" font-size="11" fill="#22d3ee" text-anchor="middle">ENTRY</text>
    
    <circle cx="-60" cy="-60" r="35" fill="none"/>
    <text x="-60" y="-55" font-family="IBM Plex Mono, monospace" font-size="11" fill="#22d3ee" text-anchor="middle">CHECK</text>
    
    <circle cx="60" cy="-60" r="35" fill="none"/>
    <text x="60" y="-55" font-family="IBM Plex Mono, monospace" font-size="11" fill="#22d3ee" text-anchor="middle">DECRYPT</text>
    
    <circle cx="-60" cy="60" r="35" fill="none"/>
    <text x="-60" y="65" font-family="IBM Plex Mono, monospace" font-size="11" fill="#22d3ee" text-anchor="middle">VALIDATE</text>
    
    <circle cx="180" cy="0" r="35" fill="none"/>
    <text x="180" y="5" font-family="IBM Plex Mono, monospace" font-size="11" fill="#22d3ee" text-anchor="middle">EXIT</text>
    
    <!-- Edges -->
    <line x1="-145" y1="0" x2="-95" y2="-60" marker-end="url(#arrow)"/>
    <line x1="-145" y1="0" x2="-95" y2="60" marker-end="url(#arrow)"/>
    <line x1="-25" y1="-60" x2="25" y2="-60" marker-end="url(#arrow)"/>
    <line x1="-25" y1="60" x2="25" y2="-60" marker-end="url(#arrow)"/>
    <line x1="95" y1="-60" x2="145" y2="0" marker-end="url(#arrow)"/>
    <line x1="95" y1="60" x2="145" y2="0" marker-end="url(#arrow)"/>
    
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
      </marker>
    </defs>
  </g>
  <text x="400" y="380" font-family="IBM Plex Mono, monospace" font-size="14" fill="#5f6978" text-anchor="middle">Figure (3): Analysis of code flow and programming logic</text>

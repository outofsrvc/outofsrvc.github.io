<!DOCTYPE html>
<!-- GitHub Pages only serves the 404 page from the site root, but this site
     puts every language (including the default) under a subdirectory, so the
     styled 404 pages live at /ar/404.html and /en/404.html. This shim picks
     the right one from the requested path and forwards to it. -->
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — P01NT</title>
  <script>
    (function () {
      var lang = location.pathname.indexOf('/en/') === 0 ? 'en' : 'ar';
      location.replace('/' + lang + '/404.html');
    })();
  </script>
  <style>
    body { margin: 0; display: grid; place-items: center; min-height: 100vh;
           background: #0d1117; color: #c9d1d9;
           font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
</head>
<body>
  <p>404 — <a href="/ar/" style="color:#58a6ff">P01NT</a></p>
</body>
</html>
